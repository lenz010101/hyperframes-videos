name: HyperFrames Render
on:
  workflow_dispatch:
    inputs:
      fps:
        description: "FPS"
        required: true
        default: "30"
      resolution:
        description: "Resolution preset"
        required: true
        default: "portrait"
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Render with HyperFrames
        run: npx hyperframes render . --output ./out/render.mp4 --fps ${{ github.event.inputs.fps }} --resolution ${{ github.event.inputs.resolution }} --format mp4
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-render
          path: out/
          retention-days: 7
