<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Instagram Edit Match Refe</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#stage{position:absolute;inset:0;display:grid;place-items:center;background:#000}video{width:100%;height:100%;object-fit:cover;transform:translate3d(0,0,0);filter:contrast(1.05) saturate(1.1);aspect-ratio:9/16}</style></head><body><div id="stage" data-duration="53000"><video id="baseVideo" src="Instagram.mp4" muted playsinline preload="auto" autoplay></video></div><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script>const video=document.getElementById("baseVideo");const tl=gsap.timeline({paused:true});const DUR_REFE=53.53333333333333;const DUR_INST=37.14501111111111;video.play().catch(()=>{});fetch("scenes.json").then(r=>r.json()).then(data=>{const scenes=data.scene_times_inst||[];tl.set(video,{currentTime:0});scenes.forEach(t=>{const refTime=t*DUR_REFE/DUR_INST;tl.set(video,{currentTime:t},refTime);});tl.set(video,{currentTime:DUR_INST},DUR_REFE);});window.__timelines={main:tl};</script></body></html>
