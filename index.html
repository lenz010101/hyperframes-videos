<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Instagram Edit Match Refe</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#stage{position:absolute;inset:0;display:grid;place-items:center;background:#000}video{width:100%;height:100%;object-fit:cover;transform:translate3d(0,0,0);filter:contrast(1.05) saturate(1.1);aspect-ratio:536/954}</style></head><body><div id="stage" data-duration="53000"><video id="baseVideo" src="Instagram.mp4" muted playsinline preload="auto"></video></div><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script>const video=document.getElementById("baseVideo");const tl=gsap.timeline({paused:true});const DUR_REFE=53.53333333333333;const DUR_INST=37.14501111111111;fetch("scenes.json").then(r=>r.json()).then(data=>{const scenes=data.scene_times_inst||[];tl.set(video,{autoAlpha:1,currentTime:0});scenes.forEach(t=>tl.to(video,{currentTime:t,duration:0.02,ease:"none"},t/(DUR_INST/DUR_REFE)));tl.to(video,{currentTime:DUR_INST,duration:0.02,ease:"none"},DUR_REFE);});window.__timelines={main:tl};</script></body></html>
