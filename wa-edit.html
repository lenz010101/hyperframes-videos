<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>WhatsApp Edit Match Refe - Motion Graphics</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;inset:0;display:grid;place-items:center;background:#000}
#vwrap{position:absolute;inset:0;transform-origin:50% 50%}
video{width:100%;height:100%;object-fit:cover;transform:translate3d(0,0,0);filter:contrast(1.08) saturate(1.15) brightness(1.02)}
.words{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.word{font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:clamp(34px,9vw,104px);color:#fff;text-shadow:0 0 20px rgba(0,0,0,.85);opacity:0;transform:translateY(30px) scale(.95);text-align:center;max-width:88%}
.bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#ff3b5c,#ff9a3c);transform:scaleX(0);transform-origin:left}
</style>
</head>
<body>
<div id="stage">
  <div id="vwrap">
    <video id="baseVideo" src="whatsapp.mp4" playsinline preload="auto" data-has-audio="true"></video>
  </div>
  <div class="words" id="words"></div>
  <div class="bar" id="bar"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const video=document.getElementById('baseVideo');
const tl=gsap.timeline({paused:true});
window.__timelines={main:tl};
const DUR_REFE=53.53333333333333;
fetch('scenes.json').then(r=>r.json()).then(data=>{
  const DUR_WA=data.dur_whatsapp||50.4;
  document.getElementById('stage').setAttribute('data-duration',Math.round(DUR_WA*1000));
  tl.to('#bar',{scaleX:1,duration:DUR_REFE,ease:'none'},0);
  (data.overlay_words||[]).forEach((beat,i)=>{
    const [tRef,word]=beat;
    const t=tRef*DUR_WA/DUR_REFE;
    const el=document.createElement('div');
    el.className='word'; el.id='w'+i; el.textContent=word;
    document.getElementById('words').appendChild(el);
    tl.to(el,{opacity:1,y:0,scale:1,duration:0.25,ease:'power4.out'},t)
      .to(el,{opacity:0,y:-20,scale:.95,duration:0.25,ease:'power4.in'},t+1.25)
      .set(el,{opacity:0,clearProps:'all'},t+1.51);
    if(t<DUR_WA-0.7){
      tl.to('#vwrap',{scale:1.09,duration:0.12,ease:'power2.out'},t)
        .to('#vwrap',{scale:1,duration:0.5,ease:'power1.inOut'},t+0.55);
    }
  });
});
</script>
</body>
</html>
