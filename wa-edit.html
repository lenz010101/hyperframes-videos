<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>WhatsApp Edit Match Refe - Motion Graphics</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;inset:0;display:grid;place-items:center;background:#000}
#vwrap{position:absolute;inset:0;transform-origin:50% 50%;z-index:1}
video{width:100%;height:100%;object-fit:cover;transform:translate3d(0,0,0);filter:contrast(1.08) saturate(1.15) brightness(1.02)}
.words{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}
.word{font-family:'Archivo Black',Arial,Helvetica,sans-serif;font-size:clamp(36px,9vw,104px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 28px rgba(0,0,0,.8);opacity:0;text-align:center;max-width:88%}
.caps{position:absolute;left:0;right:0;bottom:9%;display:grid;place-items:center;pointer-events:none;z-index:4}
.cap{font-family:'Archivo Black',Arial,Helvetica,sans-serif;font-size:clamp(24px,5.6vw,62px);color:#fff;opacity:0;text-align:center;max-width:86%;letter-spacing:.4px;line-height:1.18;
text-shadow:1px 1px 0 #8b3dff,2px 2px 0 #8b3dff,3px 3px 0 #6d24e0,4px 4px 0 #5618bd,5px 5px 0 #3f0d99,6px 6px 0 #2c0876,7px 7px 14px rgba(0,0,0,.65),0 0 30px rgba(150,90,255,.4)}
.flash{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:linear-gradient(115deg,#ff3b5c 0%,#b23bff 45%,#3bd2ff 100%)}
.bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#ff3b5c,#ff9a3c);transform:scaleX(0);transform-origin:left;z-index:5}
</style>
</head>
<body>
<div id="stage" data-duration="50.4">
  <div id="vwrap">
    <video id="baseVideo" src="whatsapp.mp4" playsinline preload="auto" data-has-audio="true"></video>
  </div>
  <div class="flash" id="flash"></div>
  <div class="words" id="words"></div>
  <div class="caps" id="caps" data-track-kind="captions"></div>
  <div class="bar" id="bar"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const video=document.getElementById('baseVideo');
const DUR_REFE=53.53333333333333;
fetch('scenes.json').then(r=>r.json()).then(data=>{
  const DUR_WA=data.dur_whatsapp||50.4;
  const tl=gsap.timeline({paused:true});
  tl.to('#bar',{scaleX:1,duration:DUR_REFE,ease:'none'},0);
  tl.fromTo('#baseVideo',{opacity:1},{opacity:1,duration:0.01},0);
  const words=document.getElementById('words');
  const caps=document.getElementById('caps');
  let ai=0;
  (data.captions_whatsapp||[]).forEach(([s,e,txt])=>{
    if(e<=s+0.05||s>=DUR_WA-0.2){return}
    e=Math.min(e,DUR_WA-0.05);
    const el=document.createElement('div');
    el.className='cap'; el.id='cap'+ai; el.textContent=txt; caps.appendChild(el);
    tl.fromTo(el,{opacity:0,y:26,filter:'blur(6px)'},{opacity:1,y:0,filter:'blur(0px)',duration:0.28,ease:'power4.out'},s)
      .to(el,{opacity:0,y:-16,duration:0.24,ease:'power4.in'},e-0.24)
      .set(el,{opacity:0,y:-16},e-0.2);
    const t=document.createElement('audio');
    t.className='clip'; t.id='sftick'+ai; t.src='assets/sfx/tick.wav'; t.loop=false;
    t.setAttribute('data-start',s.toFixed(3)); t.setAttribute('data-duration','0.12'); t.setAttribute('data-volume','0.3');
    document.getElementById('stage').appendChild(t);
    ai++;
  });
  (data.overlay_words||[]).forEach((beat,i)=>{
    const [tRef,word]=beat;
    const t=tRef*DUR_WA/DUR_REFE;
    if(t>=DUR_WA-0.6){return}
    const el=document.createElement('div');
    el.className='word'; el.id='w'+i; el.textContent=word; words.appendChild(el);
    tl.fromTo(el,{opacity:0,y:34,scale:0.92},{opacity:1,y:0,scale:1,duration:0.25,ease:'power4.out'},t)
      .to(el,{opacity:0,y:-22,scale:.95,duration:0.25,ease:'power4.in'},t+1.2)
      .set(el,{opacity:0,y:-22},t+1.46);
    if(i%4===0){
      tl.fromTo('#flash',{opacity:0},{opacity:0.75,duration:0.1,ease:'power2.out'},t)
        .to('#flash',{opacity:0,duration:0.3,ease:'power1.in'},t+0.1)
        .fromTo('#vwrap',{x:18},{x:0,duration:0.42,ease:'power3.out'},t+0.05);
    }
    const o=document.createElement('audio');
    o.className='clip'; o.id='sfwho'+i; o.src='assets/sfx/whoosh.wav'; o.loop=false;
    o.setAttribute('data-start',t.toFixed(3)); o.setAttribute('data-duration','0.65'); o.setAttribute('data-volume','0.5');
    document.getElementById('stage').appendChild(o);
    tl.fromTo('#vwrap',{scale:1.1},{scale:1.035,duration:0.14,ease:'power2.out'},t)
    tl.fromTo('#vwrap',{scale:1.03},{scale:1.035,duration:0.1,ease:'power1.out'},t+0.16)
      .to('#vwrap',{scale:1,duration:0.46,ease:'power1.inOut'},t+0.56);
    if(i%8===0){
      const d2=document.createElement('audio');
      d2.className='clip'; d2.id='sfding'+i; d2.src='assets/sfx/ding.wav'; d2.loop=false;
      d2.setAttribute('data-start',t.toFixed(3)); d2.setAttribute('data-duration','0.35'); d2.setAttribute('data-volume','0.35');
      document.getElementById('stage').appendChild(d2);
    }
  });
  const visibleWords=words.querySelectorAll('.word').length;
  if(visibleWords===0){
    tl.fromTo('#bar',{opacity:1},{opacity:1,duration:0.01},0);
  }
  window.__timelines={main:tl};
});
</script>
</body>
</html>
